planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "tugger_navigation::RRTStarReedsSheppPlanner"

      Forward:
        tolerance: 0.25
        downsample_costmap: false
        allow_unknown: true
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 15.0

        motion_model_for_search: "DUBIN"
        angle_quantization_bins: 72
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 3.0

        minimum_turning_radius: 0.29

        reverse_penalty: 2.0
        change_penalty: 0.0
        non_straight_penalty: 1.2
        cost_penalty: 2.0
        retrospective_penalty: 0.015

      Reverse:

        tolerance: 0.25
        downsample_costmap: false
        allow_unknown: true
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 25.0
        motion_model_for_search: "DUBIN"
        angle_quantization_bins: 72
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 3.0

        minimum_turning_radius: 0.29

        reverse_penalty: 2.0
        change_penalty: 0.0
        non_straight_penalty: 1.2
        cost_penalty: 2.0
        retrospective_penalty: 0.015


controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /wheel/odom

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "precision_goal_checker", "camera_handoff_goal_checker"]
    controller_plugins: ["FollowPath", "PrecisionFollowPath", "DepartureFollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    # Route ends at a staging point. Laser localization jitters by a few cm,
    # so a tighter check makes the follower chase the jitter and stall; the
    # landmark fix at the staging stop then sets the exact pose (Phase B).
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # 15 cm: arriving later let the follower over-correct a few centimetres
      # of offset at crawling speed, swinging the heading past 20 degrees in
      # the last 15 cm. The next stage accepts a start up to 25 cm away.
      xy_goal_tolerance: 0.15
      # 15 degrees. A car-like robot cannot correct heading standing still:
      # with 5 degrees it arrived within 1 cm but 5.4 degrees off, shuffled
      # at 5 cm/s until the progress checker aborted the leg. The next stage
      # plans from the measured pose and accepts 20 degrees (direction policy,
      # rejoin gate); 15 degrees matches the station entry tolerance.
      yaw_goal_tolerance: 0.262

    # A route that hands straight to camera alignment must stop with the whole
    # red frame in view. The downward camera sees it within about 5 cm forward.
    camera_handoff_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.035

    # Used only by the saved under-stand docking paths.  Facility routes
    # retain the normal 7 cm tolerance above.  The operator independently
    # confirms this same 10 mm / 1 degree envelope before cargo attachment.
    precision_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.01745

    FollowPath:
      # Pure pursuit for speed, direction, collision checks and the approach
      # slow-down; steering from path-curvature tracking. Measured 2026-11-12:
      # pure pursuit steering cut 10-17 cm inside the 1-1.5 m long route
      # corners (it aims one look-ahead ahead and never reaches the corner
      # curvature) and overshot about 8 cm on the way out.
      plugin: "tugger_navigation::CurvatureTrackingController"
      # Steering = the path's own curvature plus a correction whose strength
      # follows the path ahead: gentle on straights (like a 1.2 m look-ahead,
      # small localization jumps barely steer), firm near and in curves (like
      # 0.6 m; shorter amplified localization noise in the offline model).
      tracking_straight_lookahead: 1.2
      tracking_curve_lookahead: 0.6
      tracking_schedule_low_curvature: 0.1
      tracking_schedule_high_curvature: 0.5
      tracking_schedule_ahead: 1.0
      tracking_schedule_behind: 0.5
      # Covers the steering slew and one control cycle.
      tracking_preview_time: 0.10
      tracking_curvature_window: 0.05
      tracking_max_curvature: 3.4
      tracking_max_heading_error: 1.05
      # Curve speed planned from the path: reach 0.6 m/s 0.2 m before a
      # curve that needs it (curvature 0.25 /m, the motion gate's curve
      # threshold) instead of braking inside it once the command turns.
      curve_speed: 0.6
      curve_speed_curvature: 0.25
      curve_speed_deceleration: 1.0
      curve_speed_margin: 0.2
      curve_speed_scan: 2.0

      max_linear_vel: 1.00  # mixed traffic: 1.0 m/s maximum (safety_fields.MAX_SPEED)
      # The look-ahead now only sets the curvature used for speed regulation
      # and the collision check arc.
      lookahead_dist: 0.90
      min_lookahead_dist: 0.60
      max_lookahead_dist: 1.20
      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.0
      use_rotate_to_heading: false
      allow_reversing: true

      transform_tolerance: 0.2

      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      # Slow over the last 1.5 m before the hand-over point. At full speed
      # the velocity-scaled lookahead (up to 0.9 m) left a corner's sideways
      # offset uncorrected until the final braking, which then swung the
      # heading by up to 21 degrees on the 1.5 m straight into HOME staging.
      approach_velocity_scaling_dist: 1.50

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.29
      regulated_linear_scaling_min_speed: 0.05

    # Segment 2 only. The look-ahead must stay well above the distance travelled
    # while the steering slews (about 0.36 s to full lock) and comparable to the
    # 0.29 m minimum turning radius. The former 0.06-0.14 m values saturated the
    # steering from a 7 cm handover offset and aborted in Gazebo. The request
    # stays below the motion gate's 0.40 m/s current-speed limit so normal
    # tracking overshoot does not trip it.
    PrecisionFollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.30  # transfer station: 0.3 m/s (ISO 3691-4 practice)
      lookahead_dist: 0.30
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.45
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.0
      use_rotate_to_heading: false
      allow_reversing: true
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.29
      regulated_linear_scaling_min_speed: 0.01

    # Loaded departure uses the independent docking controller, but has a
    # separate speed profile from the final precision approach.
    DepartureFollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.30  # transfer station: 0.3 m/s (ISO 3691-4 practice)
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.55
      lookahead_time: 0.8
      rotate_to_heading_angular_vel: 0.0
      use_rotate_to_heading: false
      allow_reversing: true
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.29
      regulated_linear_scaling_min_speed: 0.05


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.50, 0.33], [0.50, -0.33], [-0.50, -0.33], [-0.50, 0.33]]"
      footprint_padding: 0.30

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: front_lidar rear_lidar

        front_lidar:
          topic: /front_left/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

        rear_lidar:
          topic: /rear_right/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.05
        cost_scaling_factor: 3.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.50, 0.33], [0.50, -0.33], [-0.50, -0.33], [-0.50, 0.33]]"
      footprint_padding: 0.30

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: front_lidar rear_lidar

        front_lidar:
          topic: /front_left/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

        rear_lidar:
          topic: /rear_right/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.60
        cost_scaling_factor: 3.0


behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /wheel/odom
    # Activation builds the behavior tree and waits this long (ms) for each
    # action server, e.g. behavior_server's "wait". The 1000 ms default is
    # shorter than DDS discovery of a just-activated server under simulator
    # load, which failed activation ("Action server wait not available").
    wait_for_service_timeout: 5000


waypoint_follower:
  ros__parameters:
    use_sim_time: true


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true

    node_names:
      - controller_server
      - planner_server


smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
