# AMCL: real localization from the merged safety-scanner scan (/scan) on the
# static map. Replaces the simulator truth correction (Phase B3).
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    # Accurate localization map (see localization.launch.py), not the
    # conservative navigation map.
    map_topic: /localization_map
    # 4WS: turning in place and pivot transitions move the robot sideways a
    # little, so the omnidirectional motion model fits better.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Motion noise must cover real odometry error: wheels + IMU drift a few
    # percent in curves (measured up to ~10 cm over a 90-degree curve). Too
    # small a value makes the filter overconfident and it loses the robot.
    # That drift comes from turning (the linked axles steer both wheels to
    # the same angle, so they slip sideways in curves), so the noise driven
    # by rotation (alpha1, alpha4) stays at 0.15. Straight driving is
    # accurate: at 0.15 the translation-driven terms assumed about 4 cm of
    # random error per 10 cm travelled, so the particle cloud spread wide and
    # its mean jumped 0.5-2 cm sideways 2-3 times a second and wandered 2-4 cm
    # on straights (measured 2026-11-12). Omni model (nav2_amcl):
    #   rotation    sd = sqrt(alpha1 d_rot^2 + alpha2 d_trans^2)
    #   translation sd = sqrt(alpha3 d_trans^2 + alpha4 d_rot^2)
    #   strafe      sd = sqrt(alpha4 d_rot^2 + alpha5 d_trans^2)
    alpha1: 0.15  # rotation noise from rotation
    alpha2: 0.03  # rotation noise from translation (IMU yaw is accurate)
    alpha3: 0.03  # translation noise from translation
    alpha4: 0.15  # translation and strafe noise from rotation (curve slip)
    alpha5: 0.03  # strafe noise from translation
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: 0.1
    max_beams: 360
    # Scanner noise 1 cm on a 2 cm localization map; a moderate spread keeps
    # the filter steady (0.05 made it jumpy in Gazebo runs).
    sigma_hit: 0.08
    z_hit: 0.9
    z_rand: 0.1
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    # Mild random-particle recovery if the scan stops matching.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 2
    # Odometry (wheels + IMU) is accurate over short distances; correct it
    # every 10 cm or 4.5 degrees. The floor markers give the final mm at
    # stations (marker_localization).
    update_min_d: 0.10
    update_min_a: 0.08
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.3
    # The robot starts on HOME.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    random_seed: -1
    introspection_mode: "disabled"
