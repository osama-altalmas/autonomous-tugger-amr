ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # Phase B: fuse the wheel velocities (forward and sideways) and take yaw
    # rate from the gyro only. The wheel model's yaw rate is wrong whenever
    # the tyres slip in a curve; integrating the wheels' own pose would carry
    # that error into odom (robot_localization's recommended velocity fusion).
    odom0: /wheel/odom
    odom0_config:
    - false
    - false
    - false
    - false
    - false
    - false
    - true
    - true
    - false
    - false
    - false
    - false
    - false
    - false
    - false
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data
    imu0_config:
    - false
    - false
    - false
    - false
    - false
    - true
    - false
    - false
    - false
    - false
    - false
    - true
    - false
    - false
    - false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
