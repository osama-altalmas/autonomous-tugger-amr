# ==================================================
# AMR V1 — EDITABLE SIMULATION SPEED PROFILE
# ==================================================
#
# Change these values whenever you want.
#
# ROUTE_PROFILE:
#   straight sections: 1.2 m/s
#   curves:             0.6 m/s (the motion gate preserves curvature)
#   docking approach:   0.35 m/s (motion gate limit 0.4 m/s)
#   loaded departure:   0.5 m/s
#   loaded route:       1.15 / 0.6 m/s (motion gate limit 1.2 m/s)
#
# FINAL_PROFILE:
#   straight sections: 1.2 m/s
#
# IMPORTANT:
#   Speeds are meters/second in SIMULATED time.
#   High-speed settings are for Gazebo experiments only.
#
# Rebuild and restart Terminal 2 after changing
# controller parameters.
# ==================================================

four_ws_controller:
  ros__parameters:
    max_linear_speed: 1.2
    max_acceleration: 1.6
    max_deceleration: 2.5
    max_steering_rate: 2.2
    max_lateral_acceleration: 1.2

# Follower-specific settings.
# This section is read by our route launcher, not
# passed directly to the ROS controller.

follower:
  cruising_speed: 1.2
  lookahead: 0.65
  max_lateral_acceleration: 1.2
  max_tracking_error: 0.35
  max_seconds: 900
